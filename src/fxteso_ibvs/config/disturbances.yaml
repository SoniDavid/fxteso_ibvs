# Disturbance magnitudes for src/disturbances.cpp. Loaded by sim.launch.py.
# /disturbances is an inertial-frame force in newtons; the quad is 2 kg.
# Full description: documentation.md section 4.
#
#   ros2 launch fxteso_ibvs sim.launch.py disturbance:=wind
#   ros2 launch fxteso_ibvs sim.launch.py disturbance:=wind,step disturbance_seed:=7

disturbances:
  ros__parameters:

    # Constant bias, added whenever any generator is active.
    mean: [0.0, 0.0, 0.0]

    # 'step': rectangular pulse. t = 0 is the end of the node's 8 s start-up hold.
    step_amplitude: [0.3, 0.3, 0.3]   # N
    step_start: 22.0                  # s
    step_end: 25.0                    # s

    # 'gust': random force, state-independent. Use this to validate the observer.
    # Measured: 0.10 N holds visual lock, 0.20 N loses it and diverges.
    gust_sigma: [0.10, 0.10, 0.05]    # N, std-dev per axis
    gust_tau: 1.5                     # s, correlation time

    # 'wind': airspeed through drag, F ~ 0.092*|v|^2 N. State-dependent.
    wind_velocity: [0.8, 0.4, 0.0]    # m/s, |v|=0.89 -> ~0.07 N
    drag_cd_a: 0.15                   # m^2, Cd * frontal area

    # Turbulence on the wind velocity - this is what makes it gust. Zero = steady wind.
    # Rule of thumb: 10-20% of mean speed.
    wind_turbulence: [0.15, 0.15, 0.08]  # m/s, std-dev per axis
    wind_turbulence_tau: 2.0          # s, larger = slower, rollier gusts

    # 'csv': replay a recorded profile, one "x,y,z" row per 10 ms. Unopenable path aborts.
    csv: ""
