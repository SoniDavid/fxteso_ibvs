# Disturbance magnitudes for src/disturbances.cpp. /disturbances is an inertial-frame force in
# newtons; the quad is 2 kg. Profiles compose: disturbance:=wind,step

disturbances:
  ros__parameters:

    # Constant bias, added whenever any generator is active.
    mean: [0.0, 0.0, 0.0]

    # 'step': rectangular pulse. t = 0 is the end of the node's 8 s start-up hold.
    step_amplitude: [0.3, 0.3, 0.3]   # N
    step_start: 22.0                  # s
    step_end: 25.0                    # s

    # 'gust': random force, state-independent, so its truth signal is clean where 'wind' is not.
    # gust_scale:= multiplies the whole vector; the shape stays here. Same for wind_scale:=.
    gust_sigma: [0.10, 0.10, 0.05]    # N, std-dev per axis
    gust_tau: 1.5                     # s, correlation time

    # 'wind': airspeed through drag, thesis Eq. 2.25 per axis. State-dependent.
    # F_* = 0.5 * rho * (Cd*A)_* * v_rel,*^2 * sign(v_rel,*), rho = 1.225.
    wind_velocity: [0.8, 0.4, 0.0]    # m/s
    # beta_D,* * alpha_T,* from the thesis: 0.3*0.1 on x and y, 0.5*0.2 on z. Must stay these or
    # a quoted wind speed is not comparable to the thesis' own.
    drag_cd_a: [0.03, 0.03, 0.10]     # m^2 per axis, Cd * transversal area

    # Turbulence on the wind velocity - this is what makes it gust. Zero = steady wind.
    # Rule of thumb: 10-20% of mean speed.
    wind_turbulence: [0.15, 0.15, 0.08]  # m/s, std-dev per axis
    wind_turbulence_tau: 2.0          # s, larger = slower, rollier gusts

    # 'csv': replay a recorded profile, one "x,y,z" row per 10 ms. Unopenable path aborts.
    csv: ""
