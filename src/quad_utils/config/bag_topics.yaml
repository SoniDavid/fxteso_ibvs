# What rosbag:=true records; sim.launch.py flattens every group into one bag record call.
# Camera images excluded: 820x616 at 50 Hz is ~75 MB/s and would dwarf every signal here.

plant_and_target:
  - /quad_position
  - /quad_attitude
  - /quad_velocity
  - /quad_velocity_BF
  - /quad_attitude_velocity
  - /quad_thrust
  - /quad_torques
  - /desired_attitude
  - /tgt_position
  - /tgt_velocity
  - /tgt_yaw
  - /disturbances
  - /disturbances_total
  # Gazebo ground truth, published whenever BodyWrench runs (plant:=gazebo and plant:=px4).
  # Under px4 it is the only unfiltered reference against which EKF2 can be checked.
  - /quad_state
  # plant:=px4 only: whether the loop or PX4's failsafe was flying, which lock% cannot show.
  # The _v4 suffix is NOT optional - the unversioned name subscribes silently to nothing.
  # Bump it when px4_msgs bumps VehicleStatus.
  - /fmu/out/vehicle_status_v4
  # plant:=px4 only. An EKF2 reset steps quad_position; the td_linear spike is not motion.
  - /quad_estimator_reset

# thesis Figs 5.10d, 5.11a, 5.12
vision_and_observer:
  - /ImFeat_vector
  # false while fewer than four markers decode. ImFeat_vector's no-lock sentinel is
  # numerically identical to the servo setpoint, so this is the only way to tell a genuine
  # divergence from an open-loop coast.
  - /ImFeat_valid
  - /ImFeat_estimates_fxt
  - /ImFeat_dot_estimates_fxt
  - /estimation_error_fxt
  - /ibvs_dist
  - /scaled_ibvs_dist
  - /a_value
  - /z_des
  - /u_coordinates
  - /n_coordinates

# Figs 5.13, 5.14a
position_loop:
  - /error_visual_servoing
  - /error_dot_visual_servoing
  - /ibvs_ss
  - /ibvs_control_input
  - /adaptive_gain
  - /position_error

attitude_loop:
  - /error_att
  - /error_attVel
  - /sigma_att
  - /k_att

# tracking differentiators and their estimation errors (Fig 5.11b)
differentiators:
  - /attitude_estimates
  - /attitude_desired_estimates
  - /lin_vel_BF_estimates
  - /position_estimates
  - /attitude_td_error
  - /attitude_des_td_error
  - /position_td_error

# Foxglove 3D panel
visualisation:
  - /tf
  - /quad_path
  - /tgt_path
  - /ibvs_markers
